name: Normalize Vercel Identity

on:
  push:
    branches:
      - master
    paths-ignore:
      - '.github/workflows/vercel-deploy.yml'

permissions:
  contents: write

jobs:
  normalize-identity:
    runs-on: ubuntu-latest
    # Chỉ chạy nếu:
    # 1. Không phải commit do chính workflow tạo ra (tránh loop)
    # 2. Commit author KHÔNG phải codekhongngu (identity sai → cần normalize)
    if: |
      !contains(github.event.head_commit.message, '[skip vercel]') &&
      github.event.head_commit.author.email != 'codekhongngu@gmail.com'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Configure Git (unified Vercel identity)
        run: |
          git config user.name "codekhongngu"
          git config user.email "codekhongngu@gmail.com"

      - name: Pull latest changes
        run: git pull origin ${{ github.ref_name }}

      - name: Create trigger commit
        run: |
          git commit --allow-empty -m "chore: trigger vercel deployment [skip vercel]"

      - name: Push trigger commit
        run: git push origin ${{ github.ref_name }}