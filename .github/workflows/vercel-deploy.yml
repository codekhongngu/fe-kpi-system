name: Trigger Vercel Deployment

on:
  push:
    branches:
      - master
    paths-ignore:
      - '.github/workflows/vercel-deploy.yml'

permissions:
  contents: write

jobs:
  trigger-deploy:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip vercel]')"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Configure Git (unified Vercel identity)
        run: |
          git config --global user.name "codekhongngu"
          git config --global user.email "codekhongngu@gmail.com"

      - name: Pull latest changes
        run: git pull origin ${{ github.ref_name }}

      - name: Create trigger commit
        run: |
          git commit --allow-empty -m "chore: trigger vercel deployment [skip vercel]"

      - name: Push trigger commit
        run: git push origin ${{ github.ref_name }}